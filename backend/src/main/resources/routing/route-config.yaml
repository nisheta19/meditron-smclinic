# Настройки маршрутов пациента (ROUTES-REQUIREMENTS v1.1, раздел 16).
# Все сроки, тексты, таймеры, лестница эскалации, локации и врачи — здесь, не в коде.
# Длительности: «30m» — минуты, «24h» — часы, «5d» — дни.
version: routes-v1

messages:
  firstMessageDelay: 1m          # первое сообщение через 1–5 мин после создания маршрута (6.1)
  dailyLimitPerPatient: 1        # не больше одного автоматического сообщения в сутки на пациента (6.5)
  noShowMessageDelay: 30m        # кейс: 30–60 минут после неявки (6.4)
  preferredChannel: PERSONAL_ACCOUNT
  bookingLink: "https://sm-clinic.example/booking?route={routeId}"
  onlineLink: "https://sm-clinic.example/online?route={routeId}"

# Цепочки (6.1–6.3). action: MESSAGE | TASK | NOT_ENGAGED. template — код из templates.
chains:
  NEAR:
    - { at: 1m,  action: MESSAGE, template: INITIAL, initial: true }
    - { at: 24h, action: MESSAGE, template: REMINDER_24H }
    - { at: 72h, action: MESSAGE, template: REMINDER_72H }
    - { at: 5d,  action: TASK, task: CALL_PATIENT, role: COORDINATOR, dueIn: 2d }
    - { at: 14d, action: MESSAGE, template: REMINDER_14D }
    - { at: 30d, action: NOT_ENGAGED }
  URGENT:
    - { at: 1m,  action: MESSAGE, template: INITIAL, initial: true }
    - { at: 12h, action: MESSAGE, template: REMINDER_URGENT_12H }
    - { at: 24h, action: TASK, task: CALL_PATIENT, role: COORDINATOR, dueIn: 1d }
    - { at: 48h, action: TASK, task: MANAGER_ATTENTION, role: MANAGER, dueIn: 1d }
  OBSERVATION:
    - { at: 1m, action: MESSAGE, template: OBSERVATION_INITIAL, initial: true }

observation:
  remindBeforeControl: [14d, 3d]   # напоминания с записью на контрольное УЗИ (6.3)
  visitAfterUltrasound: 14d        # визит к специалисту после контрольного УЗИ (6.3)

additionalExam:
  defaultDue: 14d                  # тактика «дообследование», подтип TESTS (5.2)

control:
  afterSurgery:    { target: 7d,  window: 2d }    # 7±2 дня (7.2)
  afterDiagnostic: { target: 10d, window: 3d }    # 10±3 дней (7.2, 7.3)
  diagnosticTemplates: [DIAGNOSTIC_FIRST]

hospitalization:
  dateDeadlineWorkingDays: 3       # норматив: дата госпитализации за 3 рабочих дня (7.1)
  tasks:
    - { at: 24h, task: SCHEDULE_HOSPITALIZATION, role: HOSPITALIZATION_MANAGER, dueIn: 1d }
    - { at: 72h, task: SCHEDULE_HOSPITALIZATION, role: HOSPITALIZATION_MANAGER, dueIn: 1d }
    - { at: 5d,  task: MANAGER_ATTENTION,        role: MANAGER,                 dueIn: 2d }

escalation:
  confirmTimeout: 15m              # координатор подтверждает экстренную находку (9.2)
  onConfirmTimeout: [DUTY_DOCTOR, SENIOR_COORDINATOR]
  ladder:                          # кто должен нажать «Принял в работу»
    - { role: DUTY_DOCTOR,        timeout: 10m }
    - { role: SENIOR_COORDINATOR, timeout: 10m }
    - { role: HEAD_OF_DEPARTMENT }
  contactTimeout: 1h               # «Связался с пациентом» после «Принял»
  contactTimeoutRole: HEAD_OF_DEPARTMENT
  ambulanceCallAfter: 7d           # исход «вызвана скорая» (9.3)
  outcomes:
    HOSPITALIZED:          { title: "Экстренная госпитализация в нашу клинику" }
    AMBULANCE:             { title: "Вызвана скорая" }
    COMING_TODAY:          { title: "Приедет в клинику сегодня" }
    PATIENT_REFUSED:       { title: "Отказ пациента",            commentRequired: true }
    FINDING_NOT_CONFIRMED: { title: "Находка не подтвердилась",  commentRequired: true }
  dutyToProfile:                   # контрольный визит после экстренного случая (9.4)
    "Дежурный хирург": "Хирург"
    "Дежурный гинеколог": "Гинеколог"
    "Дежурный уролог": "Уролог"
    "Дежурный хирург / флеболог": "Флеболог / хирург"
    "Дежурный хирург / сосудистый хирург": "Сосудистый хирург"
    "Дежурный гинеколог / дежурный хирург": "Гинеколог"

# Тип маршрута для фильтра дашборда (17.2): по шаблону маршрута из словаря.
routeTypes:
  SURGICAL_STANDARD: SURGICAL
  DIAGNOSTIC_FIRST: DIAGNOSTIC
  OBSERVATION_FOLLOWUP: OBSERVATION
  CONSULT_OBSERVATION: CONSULTATION
  URGENT_ESCALATION: EMERGENCY

# Шаблоны сообщений (6.6). Подстановки: {specGen} {specIns} {specDat} {link} {onlineLink} {term} {n}
# {date} {time} {place} {name}. Фрагмент в [[…]] остаётся, только если специалисту разрешён онлайн.
templates:
  INITIAL:
    title: "Первое сообщение"
    full: "Ваш результат УЗИ готов. В исследовании описаны изменения, по которым рекомендуется консультация {specGen} для определения дальнейшей тактики. Консультация нужна, чтобы уточнить результат исследования. Вы можете: записаться на очную консультацию — {link};[[ получить онлайн-консультацию — {onlineLink};]] оставить заявку на звонок"
    short: "Результат исследования готов. Подробности и запись — в личном кабинете: {link}"
  REMINDER_24H:
    title: "Напоминание через 24 часа"
    full: "Напоминание: по результату УЗИ Вам рекомендована консультация {specGen}. Консультация нужна, чтобы уточнить результат исследования. Вы можете выбрать удобный формат — очно[[ или онлайн]]: {link}"
    short: "Напоминание: по результату УЗИ Вам рекомендована консультация профильного специалиста. Вы можете выбрать удобный формат — очно[[ или онлайн]]"
  REMINDER_72H:
    title: "Напоминание через 72 часа"
    full: "По результатам исследования остаётся рекомендация проконсультироваться с {specIns}. Подобрать врача и удобное время можно по ссылке: {link}"
    short: "По результатам исследования остаётся рекомендация проконсультироваться с врачом. Подобрать специалиста и удобное время можно по ссылке: {link}"
  REMINDER_14D:
    title: "Напоминание на 14-й день"
    full: "Напоминаем о рекомендации обратиться к {specDat} по результатам ранее выполненного исследования. Если консультация уже состоялась в другой медицинской организации, Вы можете отметить это в личном кабинете"
    short: "Напоминаем о рекомендации обратиться к профильному врачу по результатам ранее выполненного исследования. Если консультация уже состоялась в другой медицинской организации, Вы можете отметить это в личном кабинете"
    buttons: [BOOK, OTHER_ORGANIZATION, NOT_PLANNING]
  NO_SHOW:
    title: "После неявки"
    full: "Сегодня не состоялась запланированная консультация {specGen}. Если вопрос остаётся актуальным, мы можем предложить другое время[[ или онлайн-консультацию]]. Перезаписаться: {link}"
    short: "Сегодня не состоялась запланированная консультация врача. Если вопрос остаётся актуальным, мы можем предложить другое время[[ или онлайн-консультацию]]. Перезаписаться: {link}"
  REMINDER_URGENT_12H:
    title: "Напоминание (срочно), 12 часов"
    full: "Напоминание: по результату исследования рекомендована консультация {specGen} в ближайшие дни. Записаться: {link}"
    short: "Напоминаем о рекомендованной консультации. Записаться: {link}"
  BOOKING_CONFIRMED:
    title: "Подтверждение записи"
    manual: false
    full: "Вы записаны к {specDat}: {date}, {time}, {place}. Изменить или отменить: {link}"
    short: "Вы записаны на приём {date} в {time}. Подробности в личном кабинете"
  OBSERVATION_INITIAL:
    title: "Наблюдение: первое сообщение"
    full: "Рекомендовано контрольное исследование и визит к {specDat} через {term}. Консультация нужна, чтобы уточнить результат исследования. Мы напомним заранее"
    short: "Результат исследования готов. Подробности в личном кабинете"
  OBSERVATION_REMINDER:
    title: "Наблюдение: напоминание о контрольном УЗИ"
    full: "Через {n} дней рекомендовано контрольное исследование перед визитом к {specDat}. Записаться на УЗИ: {link}"
    short: "Напоминаем о рекомендованном визите в клинику. Записаться: {link}"
  CONTROL_BOOKED:
    title: "Контрольный приём назначен"
    manual: false
    full: "Контрольный приём после проведённого лечения назначен на {date} в {time}. Подтвердить / изменить время: {link}"
    short: "Контрольный приём назначен на {date} в {time}. Подробности в личном кабинете"
  CONTROL_RECOMMENDED:
    title: "Рекомендован контрольный приём"
    full: "После проведённого лечения рекомендован контрольный приём врача через {term}. Выбрать время: {link}"
    short: "Рекомендован контрольный приём врача через {term}. Выбрать время: {link}"

callScript: "Добрый день, {name}. Вы недавно проходили у нас УЗИ. По результатам исследования врач рекомендовал консультацию {specGen} для определения дальнейшей тактики. Мы видим, что консультация пока не состоялась. Могу помочь подобрать врача и удобное время — очно[[ или онлайн]]"

# Падежи специалистов (6.8): родительный, творительный, дательный.
specialists:
  "Хирург": [хирурга, хирургом, хирургу]
  "Оперирующий гинеколог": [оперирующего гинеколога, оперирующим гинекологом, оперирующему гинекологу]
  "Гинеколог": [гинеколога, гинекологом, гинекологу]
  "Гинеколог-эндокринолог": [гинеколога-эндокринолога, гинекологом-эндокринологом, гинекологу-эндокринологу]
  "Онкогинеколог": [онкогинеколога, онкогинекологом, онкогинекологу]
  "Маммолог": [маммолога, маммологом, маммологу]
  "Онколог / маммолог-онколог": [онколога / маммолога-онколога, онкологом / маммологом-онкологом, онкологу / маммологу-онкологу]
  "Уролог": [уролога, урологом, урологу]
  "Эндокринолог": [эндокринолога, эндокринологом, эндокринологу]
  "Гастроэнтеролог": [гастроэнтеролога, гастроэнтерологом, гастроэнтерологу]
  "Гастроэнтеролог / колопроктолог": [гастроэнтеролога / колопроктолога, гастроэнтерологом / колопроктологом, гастроэнтерологу / колопроктологу]
  "Гастроэнтеролог / хирург-гепатолог": [гастроэнтеролога / хирурга-гепатолога, гастроэнтерологом / хирургом-гепатологом, гастроэнтерологу / хирургу-гепатологу]
  "Терапевт (коррекция факторов риска)": [терапевта, терапевтом, терапевту]
  "Терапевт / гастроэнтеролог": [терапевта / гастроэнтеролога, терапевтом / гастроэнтерологом, терапевту / гастроэнтерологу]
  "Флеболог": [флеболога, флебологом, флебологу]
  "Флеболог / хирург": [флеболога / хирурга, флебологом / хирургом, флебологу / хирургу]
  "Флеболог / сосудистый хирург": [флеболога / сосудистого хирурга, флебологом / сосудистым хирургом, флебологу / сосудистому хирургу]
  "Флеболог / сердечно-сосудистый хирург": [флеболога / сердечно-сосудистого хирурга, флебологом / сердечно-сосудистым хирургом, флебологу / сердечно-сосудистому хирургу]
  "Сосудистый хирург": [сосудистого хирурга, сосудистым хирургом, сосудистому хирургу]
specialistFallback: [профильного специалиста, профильным специалистом, профильному специалисту]

# Расписание (11).
schedule:
  locations: [Текстильщики, Сенежская, ВДНХ]
  onlineLabel: "онлайн"
  days: 5                 # слоты на ближайшие рабочие дни
  dayStart: "09:00"
  dayEnd: "19:00"
  stepMinutes: 90
  onlineAllowed:          # онлайн для первичного и повторного визита (11.3)
    - "Эндокринолог"
    - "Гастроэнтеролог"
    - "Гастроэнтеролог / колопроктолог"
    - "Гастроэнтеролог / хирург-гепатолог"
    - "Терапевт (коррекция факторов риска)"
    - "Терапевт / гастроэнтеролог"
    - "Гинеколог-эндокринолог"
  noSlotsPrefixes: ["Дежурный", "Координатор"]
  doctors:                # вымышленные врачи (11.2)
    "Хирург": ["Ковалёв А. С.", "Миронова Т. В."]
    "Оперирующий гинеколог": ["Иванова Е. А.", "Белых О. Н."]
    "Гинеколог": ["Соловьёва Н. П.", "Гусева И. А."]
    "Гинеколог-эндокринолог": ["Кравец Л. М."]
    "Онкогинеколог": ["Орехов В. Д."]
    "Маммолог": ["Зайцева М. Ю."]
    "Онколог / маммолог-онколог": ["Лебедев П. К.", "Чернова А. Р."]
    "Уролог": ["Тихонов Р. Е.", "Ефимов Г. Л."]
    "Эндокринолог": ["Сафонова Д. И.", "Рябова К. С."]
    "Гастроэнтеролог": ["Фомин С. В."]
    "Гастроэнтеролог / колопроктолог": ["Фомин С. В."]
    "Гастроэнтеролог / хирург-гепатолог": ["Фомин С. В."]
    "Терапевт (коррекция факторов риска)": ["Никитина Ю. А."]
    "Терапевт / гастроэнтеролог": ["Никитина Ю. А."]
    "Флеболог": ["Воронцов И. И."]
    "Флеболог / хирург": ["Воронцов И. И."]
