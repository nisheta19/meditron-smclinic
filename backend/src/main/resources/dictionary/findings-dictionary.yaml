        targetDays: 0
      - all: [{ attr: location, eq: ureter }]
        level: URGENT
        targetDays: 3
      - all: []                 # камни почки без обструкции — плановая консультация
        targetDays: 30
    ifMissing: TRIGGER
    examples: ["синт_12 — камень мочеточника с обструкцией", "синт_22 — без обструкции"]

  - code: BPH
    name: ДГПЖ / изменения предстательной железы
    active: true
    approved: true
    level: PLANNED
    studyTypes: [PROSTATE]
    clinicalNote: Операция — только при сочетании выраженной симптоматики с увеличением железы; симптомы оценивает уролог.
    synonyms:
      - ДГПЖ
      - аденома простаты
      - доброкачественная гиперплазия предстательной железы
      - гиперплазия переходных зон
      - аденоматозные узлы
      - узловая форма ДГПЖ
      - увеличение объёма предстательной железы
      - по типу хронического простатита     # prostatitisPattern=true
    attributes: [volumeCm3, growth, prostatitisPattern, intravesicalMm]
    extraction:
      - "volumeCm3: объём железы (см³ = мл)."
      - "prostatitisPattern=true: «по типу хронического простатита» (УЗИ-признаки неспецифичны)."
      - "Остаточная моча -> отдельная находка BPH_URINARY_RETENTION."
    notThis:
      - "Кальцинаты, ретенционные кисты, фиброз, изменения семенных пузырьков — атрибуты, не находка."
    targetSpecialty: Уролог
    routeTemplateCode: CONSULT_OBSERVATION
    targetDays: 30
    rules:
      - all: [{ attr: growth, eq: true }]
        targetDays: 14          # рост узловой ДГПЖ
      - all: [{ attr: volumeCm3, gt: 25 }]
        targetDays: 30
      - all: [{ attr: prostatitisPattern, eq: true }]
        targetDays: 30          # изолированно — плановая консультация; при ДГПЖ — атрибут того же блока
      - all: []
        result: NO_ROUTE
    ifMissing: TRIGGER
    examples: ["простата (2) — 31 см³", "простата (5) — 25,1 см³", "простата (10) — рост"]

  - code: BPH_URINARY_RETENTION
    name: Остаточная моча / нарушение оттока мочи
    active: true
    approved: true
    level: PLANNED
    studyTypes: [PROSTATE]
    synonyms: [остаточная моча, объём остаточной мочи, избыточное количество остаточной мочи, нарушение пассажа мочи]
    attributes: [residualUrineMl]
    extraction:
      - "residualUrineMl: объём остаточной мочи в мл."
    notThis: ["«Остаточной мочи нет», «в пределах нормы» -> NEGATION."]
    targetSpecialty: Уролог
    routeTemplateCode: CONSULT_OBSERVATION
    targetDays: 14
    rules:
      - all: [{ attr: residualUrineMl, gte: 300 }]
        targetDays: 7           # ≥ 300 мл — показание к уродинамическому исследованию
      - all: [{ attr: residualUrineMl, gte: 50 }]
        targetDays: 14          # порог 50 мл — решение медэксперта
      - all: []
        result: NO_ROUTE
    ifMissing: TRIGGER          # «нарушение пассажа мочи» без объёма — запускать
    examples: ["простата (8) — 87 мл", "простата (9) — 100 мл", "синт_23 — 320 мл"]

