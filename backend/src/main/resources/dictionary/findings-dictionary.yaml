  - code: THYROID_NODULE
    name: Узловое образование щитовидной железы
    active: true
    approved: true
    level: PLANNED
    studyTypes: [THYROID]
    synonyms:
      - узел щитовидной железы
      - узлы щитовидной железы
      - узловое образование щитовидной железы
      - узловой зоб
      - многоузловой зоб
      - коллоидный узел
      - губчатый узел
      - изо- / гипо- / гиперэхогенное образование щитовидной железы
      - EU-TIRADS
      - TI-RADS
      - TR
    attributes: [tirads, tiradsRaw, tiradsSystem, sizeMm, count, side, growth, suspiciousFeatures, suspiciousLymphNodes, uncertain]
    extraction:
      - "tirads / tiradsRaw / tiradsSystem — см. ml.categoryParsing (Kwak 4b/4c -> EU 5)."
      - "Губчатый узел без категории -> tirads=2, tiradsSystem=UNKNOWN."
      - "Категория по долям — отдельная находка на каждую долю (side)."
      - "suspiciousFeatures — список из: микрокальцинаты, выраженно гипоэхогенный, неровный / нечёткий контур, вертикальная ориентация (выше, чем шире), экстратиреоидное распространение."
      - "growth=true: значимый рост — ≥ 2 размеров на ≥ 20% (не менее 2 мм) за год или объём > 50% за год, либо врач прямо пишет о росте."
      - "suspiciousLymphNodes=true: шейные лимфоузлы с утолщённым корковым слоем и нарушенной дифференцировкой, с кальцинатами или кистозными изменениями."
      - "Категория не указана -> флаг INCOMPLETE."
    notThis:
      - "Диффузные изменения, АИТ -> THYROID_DIFFUSE_AIT; диффузный зоб -> THYROID_ENLARGEMENT."
      - "Расширенные фолликулы, микро- / макрофолликулы без слова «узел» — не узел."
    targetSpecialty: Эндокринолог
    routeTemplateCode: CONSULT_OBSERVATION
    targetDays: 30
    rules:
      - all: [{ attr: tirads, missing: true }]
        targetDays: 30          # категория не указана + флаг INCOMPLETE
      - all: [{ attr: tirads, eq: 5 }, { attr: sizeMm, gt: 10 }]
        routeTemplateCode: DIAGNOSTIC_FIRST     # ТАБ
        targetDays: 14
      - all: [{ attr: tirads, eq: 4 }, { attr: sizeMm, gt: 15 }]
        routeTemplateCode: DIAGNOSTIC_FIRST
        targetDays: 14
      - all: [{ attr: tirads, eq: 3 }, { attr: sizeMm, gt: 20 }]
        routeTemplateCode: DIAGNOSTIC_FIRST
        targetDays: 14
      - all: [{ attr: growth, eq: true }]
        targetDays: 14
      - all: [{ attr: tirads, eq: 5 }]
        targetDays: 14          # < 10 мм — ТАБ или активное наблюдение
      - all: [{ attr: tirads, eq: 4 }]
        targetDays: 30          # 5–15 мм — УЗИ через 1 год
      - all: [{ attr: tirads, lte: 3 }, { attr: sizeMm, gte: 10 }]
        targetDays: 30          # от 10 мм до порога ТАБ — УЗИ через 3–5 лет
      - all: []
        result: NO_ROUTE        # EU-TIRADS 2–3 до 10 мм
    ifMissing: TRIGGER
    examples: ["щитовидка (6), (3) — EU-TIRADS 3", "щитовидка (1), (2), (7), (8) — TI-RADS 2", "щитовидка (4), (5) — узлы без категории", "синт_17 — EU-TIRADS 4, 18 мм", "синт_18 — Kwak 4b"]

