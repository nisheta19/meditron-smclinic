# Словарь находок — dict-v2.1 (утверждён медэкспертом)
# Один файл читают и ML (что искать и как извлекать), и бэкенд (куда направлять).
#
# Кто что использует:
#   ML      -> code, studyTypes, synonyms, attributes, extraction, notThis, + общие блоки ml, flags
#   Бэкенд  -> level, rules, targetSpecialty, targetDays, routeTemplateCode, ifMissing, + блоки backend, flags
#
# УРОВНИ (level) — новое в v2, заменяет urgent: true/false
#   EMERGENCY — экстренно: шаблон URGENT_ESCALATION, задача дежурному врачу, пациенту система не пишет.
#   URGENT    — срочно: обычный маршрут с коротким сроком (1–3 дня), первое сообщение пациенту в день подтверждения.
#   PLANNED   — плановый маршрут.
#   level задаётся у находки (по умолчанию) и может переопределяться в правиле.
#
# КАК БЭКЕНД ПРИМЕНЯЕТ rules
#   Правила проверяются сверху вниз, срабатывает первое, у которого выполнены ВСЕ условия (all).
#   Правило может переопределить level, специалиста, срок и шаблон маршрута.
#   result: NO_ROUTE — проверка останавливается, маршрут не запускается (notTriggered, BELOW_THRESHOLD).
#   all: [] — правило без условий (срабатывает всегда, ставится последним).
#
#   Операторы условий: eq, ne, gt, gte, lt, lte, in, missing.
#     { attr: X, missing: true }   — условие выполнено, если атрибута нет.
#     { attr: X, lte: 7, orMissing: true } — условие выполнено, если X <= 7 или X нет.
#   attr с префиксом patient. — данные пациента из МИС (patient.age, patient.sex = F | M).
#   attr с префиксом protocol. — данные протокола (protocol.studyType).
#
#   Отсутствующие атрибуты (так работает бэкенд):
#     - булев атрибут, которого ML не прислал, считается false («признак не упомянут = признака нет»):
#       { attr: uncertain, eq: false } выполняется, если uncertain не прислан;
#     - небулев атрибут (число, категория, строка), которого нет, делает условие невыполненным,
#       правило пропускается и запоминается как «пропущено из-за отсутствия данных»;
#     - missing / orMissing проверяются до этих правил и видят отсутствие атрибута любого типа.
#   ifMissing: если ни одно правило не сработало и хотя бы одно было пропущено из-за отсутствия
#   небулева атрибута: TRIGGER -> маршрут по умолчанию (поля находки), SKIP -> notTriggered, BELOW_THRESHOLD.
#
# approved: true — медэксперт утвердил и часть для ML, и часть для бэкенда.
# Принцип: ML возвращает факты (в т.ч. функциональные кисты, BI-RADS 1–2, «признаков ущемления нет»),
# а «маршрут / не маршрут» решает бэкенд по rules.
# Источники и обоснования — в razmetka-uzi.xlsx (листы «Чек-лист по КР», «Экстренные»).

version: dict-v2.1

# ----------------------------------------------------------------------------
# Общие правила для ML
# ----------------------------------------------------------------------------
ml:
  urgentPolicy:
    - "Находки с level EMERGENCY или URGENT (у находки или в любом её правиле) — приоритет полноты: при сомнении возвращать находку с uncertain=true, а не пропускать."
    - "Отрицание («тромбоза не выявлено», «кровоток сохранён») проверять строго по той же фразе, к которой относится находка."
    - "Отрицание признака ≠ отрицание находки: «паховая грыжа, признаков ущемления нет» -> HERNIA с incarcerated=false, а не NEGATION."
  # Единое правило: что куда возвращать (одинаково в требованиях к ML, словаре и разметке)
  returnPolicy:
    findings: "В тексте утверждается то, для чего есть код, — независимо от порога, размера и категории (полип ЖП 3 мм, узел TI-RADS 2, «фолликулярная киста», наботовы кисты, BI-RADS 2, грыжа «без признаков ущемления» с incarcerated=false). Маршрут или нет — решает бэкенд."
    notTriggeredNegation: "Отрицается сама находка («данных за тромбоз не получено», «конкрементов не выявлено»). Отрицание признака находку не отменяет."
    notTriggeredNormal: "Названо физиологическое состояние, похожее на находку, но ею не являющееся: жёлтое тело / фолликул до 3 см без слова «киста», «O-RADS 1» без образования, BI-RADS 1 без других изменений, ВМС расположена правильно."
    notTriggeredPostSurgery: "Орган удалён / находка прооперирована (состояние после холецистэктомии)."
    nothing: "То, для чего нет кода (ml.notFindings): перегиб ЖП, метеоризм, кальцинаты простаты и т. п. — никуда не возвращать."
    granularity: "Одна находка = код + сторона / доля + location + тип / категория (figo, birads, orads, tirads). Несколько образований с одинаковыми ключами — одна находка с count и sizeMm наибольшего. Камень холедоха и камни ЖП — две находки GALLSTONES; узлы FIGO 0 и FIGO 4 — две находки UTERINE_FIBROID."
    scoring: "F1 считается по findings; notTriggered проверяется в ловушках и в строках разметки «Отрицание» / «Физиологическая норма»."

  whereToLook:
    - Сначала раздел «Заключение» — по нему решается, есть ли находка.
    - Атрибуты (размер, FIGO, категория) — из описательной части, если в заключении их нет.
    - Нет заключения -> искать по описанию, ставить conclusionFound=false и флаг NO_CONCLUSION.
    - "Находка есть в описании, но не вынесена в заключение (или в заключении слабее, чем в описании) -> вернуть находку по описанию + флаг DISCREPANCY."

  # Находка рядом с этими словами -> notTriggered, reason=NEGATION
  negationCues:
    - не выявлен
    - не выявлено
    - не выявлены
    - не определяется
    - не определяются
    - не визуализируется
    - не лоцируется
    - не обнаружен
    - отсутствует
    - отсутствуют
    - без признаков
    - данных за .* не получено
    - признаков .* не выявлено
    - достоверно .* не определяется
    - свободны от дополнительных эхоструктур

  # Атрибут uncertain=true (находку всё равно возвращать)
  uncertaintyCues:
    - "?"
    - нельзя исключить
    - не исключается
    - вероятно
    - более вероятно
    - возможно
    - под вопросом
    - подозрение на
    - по типу
    - изменения по типу

  # Орган удалён или находка уже прооперирована -> notTriggered, reason=POST_SURGERY
  postSurgeryCues:
    - состояние после
    - после холецистэктомии
    - удалён
    - удалена
    - резекция

  # Атрибут growth
  growthCues: [с динамикой роста, увеличение размеров, в динамике увеличение, рост]
  stableCues: [без динамики, без отрицательной динамики, стабильн]   # growth=false

  sizeParsing:
    - "Размеры вида 12х11 мм, 1.4*1.1*1.5 см, 3,6*3,5 мм -> sizeMm = наибольший размер в мм."
    - "Сантиметры переводить в мм (0,8 см -> 8)."
    - "Диапазон «до 6-8 мм», «40–50%» -> верхняя граница (8, 50)."
    - "Несколько образований -> sizeMm наибольшего, count = количество."

  sideCues:
    left: [слева, левой, левого, левая, s]
    right: [справа, правой, правого, правая, d]
    both: [с обеих сторон, обеих, билатерально, двусторонн]

  categoryParsing:
    - "BI-RADS / Birads / Br -> birads (число 0–6), подкатегория 4a/4b/4c -> biradsSub."
    - "O-RADS / ORADS, римские цифры (O-RADS I) -> orads (число)."
    - "TI-RADS: tiradsRaw — как написано; tiradsSystem: EU | ACR | KWAK | UNKNOWN; tirads — число по шкале EU:"
    - "  «EU-TIRADS N» -> tirads=N, EU.  «TR N» / «ACR TI-RADS N» -> tirads=N, ACR."
    - "  «TI-RADS 4a» -> tirads=4, KWAK; «TI-RADS 4b» / «4c» -> tirads=5, KWAK; «TI-RADS N» без системы -> tirads=N, UNKNOWN."
    - "Категория указана по сторонам / долям -> отдельная находка на каждую сторону с side."

  patientContext:
    - "menopause=true: «менопауза», «постменопауза», «постменопаузальный период», «менопауза N лет»."
    - "cycleDay: «N день цикла», «N д.м.ц.»; monthsSinceLmp — из даты последней менструации относительно даты исследования."
    - "bleeding=true: «кровянистые выделения», «мажущие выделения», «кровотечение», «АМК»."
    - "hcgPositive=true: положительный ХГЧ / тест на беременность."
    - "fasting=false: «не натощак», «после еды» -> флаг PREP_VIOLATED."

  # Не находки: не возвращать как находку (часть — атрибутами)
  notFindings:
    - "Мультифолликулярные яичники без количественных критериев (нет объёма ≥ 10 см³ и числа фолликулов ≥ 20) и без слова «поликистоз»."
    - "Косвенные признаки спаечного процесса, тонкий эндометрий — атрибуты без маршрута."
    - "Перегиб / изгиб / деформация желчного пузыря; дискинезия (атрибут); холестероз (атрибут); диффузные изменения поджелудочной железы (атрибут)."
    - "Вздутие петель кишечника, «пневматоз кишечника» (метеоризм)."
    - "Простата: кальцинаты, мелкие ретенционные кисты, фиброз, расширение / инволюция семенных пузырьков — атрибуты."
    - "Вены: анатомический вариант строения (i / h / s-тип), удвоение ствола; перфорантные вены — атрибут."
    - "Щитовидная железа: «микро- / макрофолликулы», «расширенные фолликулы» без слова «узел»; лимфоузлы с утолщённым корковым слоем при сохранённой дифференцировке — атрибут."
    - "Молочная железа: жировая инволюция и импланты без категории BI-RADS (с категорией 2 — findings BREAST_LESION, birads=2)."
    - "Жёлтое тело / фолликул до 3 см, «O-RADS 1» без образования, BI-RADS 1, правильно расположенная ВМС — не findings, а notTriggered NORMAL (см. returnPolicy)."

# ----------------------------------------------------------------------------
# Флаги протокола / находки
# ----------------------------------------------------------------------------
flags:
  DISCREPANCY:      { setBy: ML,      name: РАСХОЖДЕНИЕ,           when: "Заключение не совпадает с описанием (находка только в описании, заключение слабее описания, прилагательное противоречит цифрам)." }
  INCOMPLETE:       { setBy: ML,      name: НЕПОЛНОЕ ОПИСАНИЕ,     when: "Нет обязательных по КР параметров (категория BI-RADS / TI-RADS, расстояние тромба до соустья, толщина эндометрия в постменопаузе и т. п.)." }
  NO_CONCLUSION:    { setBy: ML,      name: НЕТ ЗАКЛЮЧЕНИЯ,        when: "В протоколе нет заключения. Бэкенд: состояние «требует внимания», маршрут не запускается." }
  PREP_VIOLATED:    { setBy: ML,      name: НАРУШЕНА ПОДГОТОВКА,   when: "Условия исследования не соблюдены (например, не натощак). Камни и полипы считаются достоверными." }
  OUTDATED_TERM:    { setBy: ML,      name: УСТАРЕВШИЙ ТЕРМИН,     when: "Термин не соответствует актуальной классификации (например, «эндоцервикоз»)." }
  INCORRECT_TERM:   { setBy: ML,      name: НЕКОРРЕКТНЫЙ ТЕРМИН,   when: "Термин не применим к УЗИ (например, «холестаз» -> читать как сладж)." }
  TEMPLATE_NORM:    { setBy: ML,      name: ШАБЛОН,                when: "Норма в шаблоне протокола расходится с КР (например, вены таза «N до 7 мм»)." }
  SYSTEM_UNKNOWN:   { setBy: backend, name: СИСТЕМА НЕ УКАЗАНА,    when: "tiradsSystem = UNKNOWN (трактуется как EU-TIRADS)." }
  SYSTEM_CONVERTED: { setBy: backend, name: СИСТЕМА ПЕРЕВЕДЕНА,    when: "tiradsSystem = ACR или KWAK (категория переведена в EU-TIRADS)." }
  DUPLICATE:        { setBy: backend, name: ДУБЛИКАТ,              when: "Тот же пациент, дата, врач и текст — второй маршрут не создаётся." }
  MINOR:            { setBy: backend, name: НЕСОВЕРШЕННОЛЕТНИЙ,    when: "patient.age < 18 — специалист заменяется на детского по тому же правилу." }
  MERGED_GYNECOLOGY: { setBy: backend, name: ОБЪЕДИНЕНО,          when: "Гинекологическая находка объединена с блоком оперирующего гинеколога (backend.mergeRules)." }

# ----------------------------------------------------------------------------
# Общие правила для бэкенда
# ----------------------------------------------------------------------------
backend:
  mergeRules:
    - "Гинекология: если одна находка требует оперирующего гинеколога, остальные гинекологические находки (кроме гинеколога-эндокринолога) идут в тот же блок; срок — по самой срочной."
    - "Флаг MINOR (младше 18 лет): правило применяется то же, специалист — детский (например, «Детский гастроэнтеролог»)."
    - "Флаг NO_CONCLUSION: маршрут не запускается, протокол в состоянии «требует внимания»."
    - "Флаг DUPLICATE: второй маршрут не создаётся."
  escalation:     # утверждено медэкспертом, лист «Экстренные»
    EMERGENCY:
      - "Находка вверху инбокса, красная метка, таймер 15 минут."
      - "После подтверждения координатором дежурный врач по профилю сразу получает уведомление и сам звонит пациенту. Система пациенту не пишет."
      - "Не подтверждено за 15 минут -> автоматическая эскалация дежурному врачу и старшему координатору."
      - "Дежурный врач не отметил контакт с пациентом за 1 час -> эскалация к заведующему."
    URGENT:
      - "Обычный маршрут с коротким сроком (1–3 дня); первое сообщение пациенту — в день подтверждения."
      - "Пациент не записался за 24 часа -> звонок координатора."
    audit: "Все этапы (кто, когда подтвердил, кто связался с пациентом) сохраняются в журнале — для разбора и дашборда."

# ----------------------------------------------------------------------------
# Шаблоны маршрутов (ссылка из routeTemplateCode)
# ----------------------------------------------------------------------------
routeTemplates:
  SURGICAL_STANDARD: консультация -> решение врача -> направление -> госпитализация -> операция -> контроль через 7±2 дня
  DIAGNOSTIC_FIRST: консультация -> диагностическая процедура (гистероскопия с биопсией / ТАБ / трепан-биопсия) -> гистология -> решение врача о тактике по результату -> контроль
  OBSERVATION_FOLLOWUP: плановый контроль у профильного врача через targetDays -> напоминание пациенту заранее -> визит состоялся
  CONSULT_OBSERVATION: консультация -> решение врача (наблюдение / обследование) -> контрольный визит
  URGENT_ESCALATION: задача дежурному персоналу немедленно, без сообщения пациенту от системы
  MANUAL_REVIEW: находка вне словаря -> координатор разбирает вручную и назначает маршрут

# ----------------------------------------------------------------------------
# Находки
# ----------------------------------------------------------------------------
findings:

  # ================= ГИНЕКОЛОГИЯ (ОМТ) =================

  - code: ENDOMETRIAL_POLYP
    name: Полип эндометрия
    active: true
    approved: true
    level: PLANNED
    studyTypes: [PELVIS_FEMALE]
    clinicalNote: Ненаблюдаемая патология — при выявлении всегда показано удаление оперирующим гинекологом.
    synonyms:
      certain:              # uncertain=false
        - полип эндометрия
        - полипы эндометрия
        - множественные полипы эндометрия
        - полипоз эндометрия
        - патология эндометрия, соответствует полипу
        - "патология эндометрия (полип)"
      suspected:            # uncertain=true
        - изменения эндометрия по типу полипа
        - эндометриальное образование, подозрительное на полип
        - очаговое образование эндометрия
        - диффузные / множественные очаговые образования эндометрия
        - локальное утолщение эндометрия
        - фокальное разрастание эндометрия
    attributes: [sizeMm, count, recurrent, menopause, uncertain]
    notThis:
      - "Полип шейки матки / цервикального канала -> CERVICAL_POLYP (отдельная находка)."
      - "Гистологическое заключение («железисто-фиброзный полип», морфология) — не протокол УЗИ, тип документа не тот."
    targetSpecialty: Оперирующий гинеколог
    routeTemplateCode: SURGICAL_STANDARD
    procedures:
      main: Гистероскопическая полипэктомия с биопсией эндометрия
      additional:
        name: Гистерорезектоскопия
        indications: [рецидивирующие полипы, образования больших размеров, нестандартное расположение]
    targetDays: 7
    rules:
      - all: [{ attr: uncertain, eq: false }]
        targetDays: 7       # полип описан точно
      - all: [{ attr: menopause, eq: true }]
        targetDays: 7       # постменопауза — 7 дней даже при подозрении (рак эндометрия у 9% в постменопаузе с полипами)
      - all: [{ attr: patient.age, gte: 50 }]
        targetDays: 7       # менопауза не указана, но возраст 50+
      - all: [{ attr: uncertain, eq: true }]
        targetDays: 14      # подозрение
    ifMissing: TRIGGER
    examples: ["Ж ОМТ (17)", "Ж ОМТ (23)", "Ж ОМТ (8)"]

  - code: ENDOMETRIAL_HYPERPLASIA
    name: Гиперплазия эндометрия
    active: true
    approved: true
    level: PLANNED
    studyTypes: [PELVIS_FEMALE]
    clinicalNote: Тактика определяется только после гистологии; система направляет на диагностику, не на операцию.
    synonyms:
      certain:
        - гиперплазия эндометрия
        - гиперпластический процесс эндометрия
      suspected:
        - диффузное утолщение эндометрия
        - утолщённый эндометрий
        - увеличение М-эхо
        - неоднородная структура эндометрия
        - неоднородный эндометрий
        - толщина эндометрия не соответствует дню цикла
        - несоответствие толщины эндометрия дню цикла
    attributes: [thicknessMm, heterogeneous, thin, cycleDay, bleeding, menopause, fromMeasurement, uncertain]
    extraction:
      - "thicknessMm: толщина эндометрия в мм. При жидкости в полости матки брать толщину эндометрия отдельно («эндометрий N мм»), а не М-эхо целиком."
      - "Если в тексте есть менопауза и указана толщина эндометрия, а слов из synonyms нет — всё равно вернуть находку с fromMeasurement=true, uncertain=true и thicknessMm."
      - "«Не соответствует дню цикла» при тонком эндометрии -> thin=true (атрибут без маршрута)."
      - "heterogeneous=true: «неоднородный», «неоднородная структура», эхогенные включения."
    notThis:
      - "«Локальное утолщение», «фокальное разрастание», «очаговое образование» эндометрия -> ENDOMETRIAL_POLYP (подозрение)."
    targetSpecialty: Оперирующий гинеколог
    routeTemplateCode: DIAGNOSTIC_FIRST
    procedures:
      diagnostic: Гистероскопия с биопсией эндометрия, гистологическое исследование
      afterHistology: Тактику (наблюдение, терапия, хирургическое лечение) определяет врач по результату гистологии
    targetDays: 7
    rules:
      # --- постменопауза: порог М-эхо 4 мм ---
      - all: [{ attr: fromMeasurement, eq: true }, { attr: thicknessMm, gt: 4 }]
        targetDays: 7
      - all: [{ attr: fromMeasurement, eq: true }]
        result: NO_ROUTE    # постменопауза, М-эхо <= 4 мм — норма
      - all: [{ attr: menopause, eq: true }]
        targetDays: 7
      # --- «гиперплазия» прямо ---
      - all: [{ attr: uncertain, eq: false }, { attr: patient.age, gte: 45 }]
        targetDays: 7
      - all: [{ attr: uncertain, eq: false }]
        targetSpecialty: Гинеколог     # биопсия эндометрия
        targetDays: 7
      # --- тонкий эндометрий ---
      - all: [{ attr: thin, eq: true }]
        result: NO_ROUTE
      # --- М-эхо > 7 мм: на 1–7 день цикла / день не указан, или на фоне кровотечения ---
      - all: [{ attr: thicknessMm, gt: 7 }, { attr: bleeding, eq: true }, { attr: patient.age, gte: 45 }]
        targetDays: 14
      - all: [{ attr: thicknessMm, gt: 7 }, { attr: bleeding, eq: true }]
        targetSpecialty: Гинеколог
        targetDays: 14
      - all: [{ attr: thicknessMm, gt: 7 }, { attr: cycleDay, lte: 7, orMissing: true }, { attr: patient.age, gte: 45 }]
        targetDays: 14
      - all: [{ attr: thicknessMm, gt: 7 }, { attr: cycleDay, lte: 7, orMissing: true }]
        targetSpecialty: Гинеколог
        targetDays: 14
      # --- «неоднородный эндометрий» без толщины ---
      - all: [{ attr: thicknessMm, missing: true }]
        targetSpecialty: Гинеколог
        routeTemplateCode: CONSULT_OBSERVATION
        targetDays: 30      # консультация, повторное УЗИ на 5–7 день цикла
      - all: []
        result: NO_ROUTE    # после 7 дня цикла толщина в пределах нормы фазы — не находка
    ifMissing: TRIGGER
    examples: ["Ж ОМТ (17) — гиперплазия прямо", "Ж ОМТ (25) — несоответствие дню цикла, неоднородный", "Ж ОМТ (14) — менопауза, проверить М-эхо"]

  - code: UTERINE_FIBROID
    name: Миома матки
    active: true
    approved: true
    level: PLANNED
    studyTypes: [PELVIS_FEMALE]
    clinicalNote: Субмукозные узлы (FIGO 0–2) и деформация полости — к оперирующему гинекологу (FIGO 3 — интрамуральный, не субмукозный). Осложнения узла — экстренно. Остальные миомы — контроль у гинеколога через 6 месяцев.
    synonyms:
      - миома матки
      - миоматозный узел
      - лейомиома
      - фибромиома
      - многоузловая миома
      - субмукозная миома
      - подслизистая миома
      - субмукозный узел
      - подслизистый узел
      - субмукозный узел на ножке
      - интрамурально-субмукозный узел
      - миома с центрипетальным ростом
      - узел деформирует полость матки
      - рождающийся миоматозный узел
    attributes: [figo, deformsCavity, prolapsing, degeneration, pedicleTorsion, uterusWeeks, compression, sizeMm, count, growth, menopause, uncertain]
    extraction:
      - "figo: «тип N по FIGO», «FIGO N» -> число."
      - "Без типа: «субмукозный узел на ножке» -> 0; «субмукозный / подслизистый» -> 1; «интрамурально-субмукозный» -> 2; «интрамуральный» -> 4; «субсерозный» -> 6."
      - "deformsCavity=true: «деформирует полость матки», «деформация полости матки»."
      - "prolapsing=true: «рождающийся узел», «рождающаяся миома», «узел в цервикальном канале», узел пролабирует в цервикальный канал."
      - "degeneration=true: нарушение кровообращения в узле — отсутствие кровотока в узле при ЦДК, отёк, некроз узла."
      - "pedicleTorsion=true: перекрут ножки субсерозного узла."
      - "uterusWeeks: только если прямо написано «соответствует N неделям»; миллиметры не пересчитывать."
      - "compression=true: сдавление соседних органов (мочевой пузырь, мочеточник, кишка)."
    notThis:
      - "Аденомиоз, диффузные изменения миометрия -> ADENOMYOSIS."
      - "Миома в стадии кальциноза — возвращать как миому, figo по описанию; кальциноз — не degeneration."
    targetSpecialty: Оперирующий гинеколог
    routeTemplateCode: SURGICAL_STANDARD
    procedures:
      main: Гистерорезектоскопия
    targetDays: 7
    rules:
      - all: [{ attr: prolapsing, eq: true }]
        level: EMERGENCY        # рождающийся узел — риск кровотечения
        targetSpecialty: Дежурный гинеколог
        routeTemplateCode: URGENT_ESCALATION
        targetDays: 0
      - all: [{ attr: degeneration, eq: true }]
        level: EMERGENCY
        targetSpecialty: Дежурный гинеколог
        routeTemplateCode: URGENT_ESCALATION
        targetDays: 0
      - all: [{ attr: pedicleTorsion, eq: true }]
        level: EMERGENCY
        targetSpecialty: Дежурный гинеколог
        routeTemplateCode: URGENT_ESCALATION
        targetDays: 0
      - all: [{ attr: menopause, eq: true }, { attr: growth, eq: true }]
        targetDays: 7           # рост миомы в постменопаузе — любой тип узла
      - all: [{ attr: figo, lte: 2 }, { attr: uncertain, eq: false }]
        targetDays: 7
      - all: [{ attr: deformsCavity, eq: true }, { attr: uncertain, eq: false }]
        targetDays: 7
      - all: [{ attr: figo, lte: 2 }]
        targetDays: 14          # подозрение
      - all: [{ attr: deformsCavity, eq: true }]
        targetDays: 14
      - all: [{ attr: growth, eq: true }]
        targetDays: 14          # рост в любом возрасте
      - all: [{ attr: uterusWeeks, gt: 12 }]
        targetDays: 14
      - all: [{ attr: compression, eq: true }]
        targetDays: 14
      - all: []                 # FIGO 3–8 или тип не указан, без роста
        targetSpecialty: Гинеколог
        routeTemplateCode: OBSERVATION_FOLLOWUP
        targetDays: 180
    ifMissing: TRIGGER
    examples: ["Ж ОМТ (11) — деформация полости", "Ж ОМТ (22) — FIGO 4, контроль 6 мес", "синт_10 — рождающийся узел", "синт_14 — FIGO 1"]

