  - code: BREAST_LESION
    name: Образование / изменения молочной железы (по BI-RADS)
    active: true
    approved: true
    level: PLANNED
    studyTypes: [BREAST]
    synonyms:
      - образование молочной железы
      - очаговое образование
      - узловое образование молочной железы
      - объёмное образование
      - солидное образование
      - фиброаденома
      - киста молочной железы
      - участок неоднородной структуры
      - участок локального фиброза
      - фиброзно-кистозная мастопатия
      - расширенные протоки с содержимым
      - BI-RADS
      - Birads
      - Br
    attributes: [birads, biradsSub, side, sizeMm, count, benignChanges, suspiciousLymphNodes, inflammation, ductContent, skinThickening, uncertain]
    extraction:
      - "Категория BI-RADS по сторонам — отдельный элемент на каждую сторону с side: BI-RADS ≥ 2 -> findings (порог решает бэкенд); BI-RADS 1 без других изменений -> notTriggered, reason=NORMAL; BI-RADS 1 при других изменениях (утолщение кожи, лимфоузлы) -> findings."
      - "birads: «BI-RADS 4», «Birads 4», «Br4», «категория 4» -> 4; «4a/4b/4c» -> biradsSub."
      - "benignChanges=true: элементы ДДМЖ — кисты, фиброз, фиброаденома, мастопатия."
      - "suspiciousLymphNodes=true: изменённые, увеличенные регионарные / аксиллярные лимфоузлы с нарушенной дифференцировкой."
      - "inflammation=true: «нельзя исключить мастит», гиперемия, уплотнение, признаки воспаления."
      - "ductContent=true: расширенные протоки с внутрипротоковым содержимым."
      - "skinThickening=true: утолщение кожи молочной железы."
      - "Категория не указана -> флаг INCOMPLETE."
    notThis:
      - "Импланты, состояние после маммопластики / мастопексии без осложнений и без категории — не находка; с категорией (Br2) — findings, birads=2."
      - "Жировая инволюция без образования и без категории — не находка."
    targetSpecialty: Маммолог
    routeTemplateCode: CONSULT_OBSERVATION
    targetDays: 30
    rules:
      - all: [{ attr: birads, gte: 5 }]
        targetSpecialty: Онколог / маммолог-онколог
        routeTemplateCode: DIAGNOSTIC_FIRST     # трепан-биопсия
        targetDays: 3
      - all: [{ attr: birads, eq: 4 }]
        targetSpecialty: Онколог / маммолог-онколог
        routeTemplateCode: DIAGNOSTIC_FIRST
        targetDays: 7
      - all: [{ attr: inflammation, eq: true }]
        targetDays: 7
      - all: [{ attr: suspiciousLymphNodes, eq: true }]
        targetDays: 7
      - all: [{ attr: birads, eq: 0 }]
        targetDays: 14
      - all: [{ attr: ductContent, eq: true }]
        targetDays: 14
      - all: [{ attr: birads, eq: 3 }]
        routeTemplateCode: OBSERVATION_FOLLOWUP
        targetDays: 180         # контрольное УЗИ через 6 месяцев
      - all: [{ attr: skinThickening, eq: true }]
        targetDays: 30
      - all: [{ attr: birads, eq: 2 }, { attr: benignChanges, eq: true }]
        routeTemplateCode: OBSERVATION_FOLLOWUP
        targetDays: 365         # УЗИ через 12 месяцев
      - all: [{ attr: birads, lte: 2 }]
        result: NO_ROUTE        # BI-RADS 1; BI-RADS 2 только с инволюцией / имплантами
      - all: []                 # категория не указана
        targetDays: 30
    ifMissing: TRIGGER
    examples: ["молочн железа (3) — BI-RADS 4, «нельзя исключить мастит»", "молочн железа (2) — BI-RADS 3 с двух сторон", "молочн железа (1) — фиброаденома без категории", "молочн железа (10) — импланты Br2", "синт_16 — BI-RADS 5"]

