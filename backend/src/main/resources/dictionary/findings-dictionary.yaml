    clinicalNote: Только один из критериев СПКЯ; диагноз по УЗИ не ставится.
    synonyms:
      - поликистозные яичники
      - поликистозная структура яичников
      - множество фолликулов по периферии
      - мультифолликулярные яичники    # только при критериях
    attributes: [follicleCount, lowFrequencyProbe, ovaryVolumeCm3, volumeCalculated, dominantStructure, onCOC, side]
    extraction:
      - "follicleCount: число фолликулов 2–9 мм в одном яичнике (наибольшее)."
      - "lowFrequencyProbe=true: трансабдоминально или датчик < 8 МГц (тогда критерий — > 10 фолликулов в одном сечении)."
      - "ovaryVolumeCm3: если не указан — посчитать 0,523 × длина × ширина × толщина (см) и поставить volumeCalculated=true."
      - "dominantStructure=true: в яичнике жёлтое тело, доминантный фолликул или киста."
      - "onCOC=true: приём КОК."
    notThis:
      - "Возвращать PCOM, если в тексте есть объём яичника ≥ 10 см³, число фолликулов ≥ 20 (> 10 при lowFrequencyProbe) или слово «поликистоз»; исключения (КОК, доминантная структура, возраст > 40) отсекает бэкенд — передать onCOC / dominantStructure."
      - "Мультифолликулярные яичники без этих признаков — не возвращать."
    targetSpecialty: Гинеколог-эндокринолог
    routeTemplateCode: CONSULT_OBSERVATION
    targetDays: 30
    rules:
      - all: [{ attr: onCOC, eq: true }]
        result: NO_ROUTE
      - all: [{ attr: follicleCount, gte: 20 }]
      - all: [{ attr: lowFrequencyProbe, eq: true }, { attr: follicleCount, gt: 10 }]
      - all: [{ attr: dominantStructure, eq: true }]
        result: NO_ROUTE        # объём не учитывается
      - all: [{ attr: patient.age, gt: 40 }]
        result: NO_ROUTE        # после 40 лет объём без увеличенного числа фолликулов — не находка
      - all: [{ attr: ovaryVolumeCm3, gte: 10 }]
      - all: []
        result: NO_ROUTE
    ifMissing: SKIP

