  - code: KIDNEY_STONES
    name: Конкременты почек / мочеточника
    active: true
    approved: true
    level: PLANNED
    studyTypes: [KIDNEY]
    synonyms:
      - конкременты почек
      - конкремент почки
      - нефролитиаз
      - уролитиаз
      - мочекаменная болезнь
