  - code: GALLSTONES
    name: Желчнокаменная болезнь
    active: true
    approved: true
    level: PLANNED
    studyTypes: [ABDOMEN]
    synonyms:
      - конкременты желчного пузыря
      - конкремент в желчном пузыре
      - камни желчного пузыря
      - холецистолитиаз
      - желчнокаменная болезнь
      - ЖКБ
      - калькулёзный холецистит
      - калькулезный холецистит
      - гиперэхогенное образование с акустической тенью     # в желчном пузыре, смещаемое
      - конкремент холедоха                                 # location=choledoch
      - холедохолитиаз                                      # location=choledoch
      - фарфоровый желчный пузырь                           # porcelain=true
      - микролиты желчного пузыря                           # uncertain=true
    attributes: [sizeMm, count, location, mobile, choledochMm, ductsDilated, porcelain, sludge, uncertain]
    extraction:
      - "location: gallbladder (по умолчанию) | choledoch (холедох, общий желчный проток)."
      - "choledochMm: диаметр холедоха в мм («Холедох 3,2 мм»)."
      - "ductsDilated=true: «холедох расширен», «расширение внутрипечёночных протоков», «билиарная гипертензия»."
      - "mobile=true: «смещаемый», «подвижный при перемене положения тела»."
      - "sludge=true: сладж вместе с камнями — атрибут, отдельную находку BILIARY_SLUDGE не возвращать."
      - "Опечатки («холидох») распознавать как холедох."
    notThis:
      - "Сладж, взвесь, замазкообразная желчь без камней -> BILIARY_SLUDGE; холестероз — атрибут."
      - "Образование без акустической тени, неподвижное -> GALLBLADDER_POLYP."
      - "Конкременты почек / мочевого пузыря / мочеточника -> KIDNEY_STONES."
      - "Состояние после холецистэктомии -> notTriggered, reason=POST_SURGERY."
    targetSpecialty: Хирург
    routeTemplateCode: CONSULT_OBSERVATION
    targetDays: 30
    rules:
      - all: [{ attr: location, eq: choledoch }, { attr: ductsDilated, eq: true }]
        level: EMERGENCY        # холедохолитиаз с расширением протоков — риск желтухи, холангита
        targetSpecialty: Дежурный хирург
        routeTemplateCode: URGENT_ESCALATION
        targetDays: 0
      - all: [{ attr: location, eq: choledoch }]
        routeTemplateCode: SURGICAL_STANDARD
        targetDays: 7           # бессимптомный холедохолитиаз — плановое лечение в хирургическом стационаре
      - all: [{ attr: porcelain, eq: true }]
        routeTemplateCode: SURGICAL_STANDARD
        targetDays: 14          # группа риска рака ЖП
      - all: [{ attr: sizeMm, gte: 30 }, { attr: patient.age, gt: 50 }]
        routeTemplateCode: SURGICAL_STANDARD
        targetDays: 14
      - all: []                 # бессимптомный холецистолитиаз: показания определяет хирург
        targetDays: 30
    ifMissing: TRIGGER
    examples: ["ЖП (13)", "ЖП (24) — калькулёзный холецистит", "ЖП (10) — после холецистэктомии, POST_SURGERY", "синт_05 — холедохолитиаз", "синт_20 — 32 мм, 60 лет", "синт_26 — после ХЭ"]

