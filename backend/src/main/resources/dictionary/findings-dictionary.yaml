  - code: FREE_FLUID
    name: Свободная жидкость в брюшной полости / малом тазу
    active: true
    approved: true
    level: URGENT
    studyTypes: [ABDOMEN, PELVIS_FEMALE]
    synonyms:
      - свободная жидкость
      - выпот
      - асцит
      - гемоперитонеум
      - жидкость в позадиматочном пространстве
      - жидкость в дугласовом пространстве
      - межпетельная жидкость
    attributes: [location, beyondPelvis, volumeMl, amount, echogenic, uncertain]
    extraction:
      - "location: брюшная полость | малый таз | межпетельно | подпечёночно | поддиафрагмально | боковой канал."
      - "beyondPelvis=true: жидкость за пределами малого таза (подпечёночное пространство / карман Морисона, боковые каналы, поддиафрагмально, межпетельно)."
      - "volumeMl: объём в мл, если указан («в объёме 40 мл»)."
      - "amount: небольшое | умеренное | значительное | большое — как написал врач."
      - "echogenic: анэхогенная | со взвесью | со сгустками (сгустки, неоднородная жидкость со сгустками)."
      - "Описание со сгустками при заключении «свободная жидкость» -> echogenic=со сгустками + флаг DISCREPANCY."
      - "Любая названная свободная жидкость, в т.ч. «небольшой выпот», — findings (физиологический выпот отсекает бэкенд). Узкая полоска жидкости у ЖП — атрибут pericholecysticFluid у ACUTE_CHOLECYSTITIS, не FREE_FLUID."
    notThis:
      - "«Свободной жидкости не выявлено / не определяется» -> NEGATION."
      - "Жидкость в грыжевом мешке -> HERNIA (incarcerated)."
    targetSpecialty: Гинеколог
    routeTemplateCode: CONSULT_OBSERVATION
    targetDays: 3
    rules:
      - all: [{ attr: echogenic, eq: со сгустками }]
        level: EMERGENCY
        targetSpecialty: Дежурный гинеколог / дежурный хирург
        routeTemplateCode: URGENT_ESCALATION
        targetDays: 0
