  # ================= ГРЫЖИ =================

  - code: HERNIA
    name: Грыжа передней брюшной стенки / паховая
    active: true
    approved: true
    level: PLANNED
    studyTypes: [ABDOMEN, SOFT_TISSUE]
    synonyms:
      - грыжа передней брюшной стенки
      - паховая грыжа
      - бедренная грыжа
      - пупочная грыжа
      - грыжа белой линии живота
      - послеоперационная вентральная грыжа
      - грыжевой дефект
      - грыжевые ворота
      - грыжевой мешок
    attributes: [sizeMm, side, content, reducible, incarcerated, obstruction, uncertain]
    extraction:
      - "sizeMm: размер грыжевых ворот / дефекта апоневроза."
      - "reducible=false: «невправимая», «не вправляется»."
      - "incarcerated=true: «ущемлённая», признаки ущемления — невправимость, отёк / утолщение стенки кишки в мешке, нарушение кровотока в содержимом, жидкость в грыжевом мешке, отсутствие перистальтики; подозрение -> incarcerated=true, uncertain=true."
      - "«Признаков ущемления нет», «без признаков ущемления» -> incarcerated=false; сама грыжа остаётся находкой (не NEGATION)."
      - "obstruction=true: расширенные петли кишки, маятникообразная перистальтика."
    notThis:
      - "Грыжа диска, грыжа пищеводного отверстия диафрагмы — не эта находка."
      - "Диастаз прямых мышц живота без грыжевого дефекта — не грыжа."
    targetSpecialty: Хирург
    routeTemplateCode: SURGICAL_STANDARD
    targetDays: 14
    rules:
      - all: [{ attr: incarcerated, eq: true }]
        level: EMERGENCY
        targetSpecialty: Дежурный хирург
        routeTemplateCode: URGENT_ESCALATION
        targetDays: 0
      - all: []
    ifMissing: TRIGGER
    examples: ["синт_11 — ущемлённая", "синт_21 — вправимая паховая", "синт_27 — пупочная без ущемления"]

