  - code: OVARIAN_LESION
    name: Образование яичника
    active: true
    approved: true
    level: PLANNED
    studyTypes: [PELVIS_FEMALE]
    synonyms:
      - киста яичника
      - образование яичника
      - объёмное образование яичника
      - эндометриоидная киста
      - эндометриома
      - дермоидная киста
      - тератома
      - кистома
      - цистаденома
      - параовариальная киста
      - жидкостное образование яичника
      - солидное образование яичника
      - кистозно-солидное образование
      - многокамерное образование яичника
      - фолликулярная киста        # функциональная -> functional=true
      - киста жёлтого тела         # функциональная -> functional=true
      - геморрагическая киста      # функциональная -> functional=true
    attributes: [orads, lesionType, sizeMm, side, bilateral, growth, solid, papillary, vascularized, septated, functional, menopause, uncertain]
    extraction:
      - "orads: «O-RADS 2», «ORADS 2», «O-RADS II» -> число; по сторонам — отдельная находка на каждую сторону. Категорию врача не пересчитывать; явное противоречие с описанием -> флаг DISCREPANCY."
      - "lesionType: simple (простая однокамерная) | functional | endometrioma | dermoid | paraovarian | other."
      - "solid=true: солидный / кистозно-солидный компонент; papillary=true: папиллярные разрастания, пристеночные включения; vascularized=true: кровоток в образовании при ЦДК."
      - "septated=true: перегородки, многокамерное."
      - "functional=true: фолликулярная киста, киста жёлтого тела, геморрагическая киста."
      - "bilateral=true: образования (эндометриомы) в обоих яичниках."
    notThis:
      - "Жёлтое тело и доминантный фолликул до 3 см без слова «киста», «O-RADS 1» без образования -> notTriggered, reason=NORMAL. Названо «киста» (фолликулярная, жёлтого тела, геморрагическая) -> findings с functional=true при любом размере."
      - "Мультифолликулярные / афолликулярные яичники, снижение овариального резерва — не образование."
      - "Гидросальпинкс -> HYDROSALPINX; тубоовариальное образование -> TUBO_OVARIAN_ABSCESS."
      - "Свободная жидкость в малом тазу — не образование яичника."
    targetSpecialty: Оперирующий гинеколог
    routeTemplateCode: SURGICAL_STANDARD
    targetDays: 14
    rules:
      - all: [{ attr: orads, gte: 4 }]
        targetSpecialty: Онкогинеколог
        targetDays: 7
      - all: [{ attr: orads, eq: 3 }]
        targetDays: 14
      - all: [{ attr: solid, eq: true }]
        targetDays: 14          # категория не указана — по описанию
      - all: [{ attr: papillary, eq: true }]
        targetDays: 14
      - all: [{ attr: growth, eq: true }]
        targetDays: 14          # рост говорит против функциональной природы
      - all: [{ attr: lesionType, eq: endometrioma }, { attr: sizeMm, gt: 50 }]
        targetDays: 14          # порог из стадирования эндометриоза — решение медэксперта
      - all: [{ attr: lesionType, eq: endometrioma }, { attr: bilateral, eq: true }]
        targetDays: 14
      - all: [{ attr: functional, eq: true }, { attr: sizeMm, lte: 30 }]
        result: NO_ROUTE
      - all: [{ attr: functional, eq: true }]
        targetSpecialty: Гинеколог
        routeTemplateCode: OBSERVATION_FOLLOWUP
        targetDays: 75          # повторное УЗИ через 2–3 месяца
      - all: [{ attr: lesionType, eq: simple }, { attr: sizeMm, lt: 50 }]
        targetSpecialty: Гинеколог
        routeTemplateCode: OBSERVATION_FOLLOWUP
        targetDays: 75
      - all: [{ attr: orads, eq: 1 }]
        result: NO_ROUTE
      - all: []                 # O-RADS 2 (эндометриома, дермоид, параовариальная) или без категории
        targetSpecialty: Гинеколог
        routeTemplateCode: CONSULT_OBSERVATION
        targetDays: 30
    ifMissing: TRIGGER
    examples: ["Ж ОМТ (7) — O-RADS 2 с ростом", "Ж ОМТ (1) — параовариальная O-RADS 2", "Ж ОМТ (6) — фолликулярная, functional", "синт_15 — O-RADS 4", "синт_28 — жёлтое тело 25 мм, не находка"]

