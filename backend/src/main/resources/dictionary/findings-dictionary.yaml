    attributes: [sizeMm, count, side, location, obstruction, uncertain]
    extraction:
      - "location: kidney (по умолчанию) | ureter (мочеточник) | bladder (мочевой пузырь)."
      - "obstruction=true: камень с расширением ЧЛС / мочеточника выше него на той же стороне, «признаки обструкции», «уретерогидронефроз»; полноту обструкции оценивает уролог — ставить uncertain=true, если врач её прямо не назвал."
    notThis:
      - "Аббревиатура «МКБ» рядом с кодом (например, «Код МКБ: N80.0») — классификатор болезней, не мочекаменная болезнь."
      - "Гиперэхогенные включения без акустической тени, кальцинаты паренхимы, фиброз синуса — не конкременты."
      - "Конкременты желчного пузыря -> GALLSTONES."
    targetSpecialty: Уролог
    routeTemplateCode: CONSULT_OBSERVATION
