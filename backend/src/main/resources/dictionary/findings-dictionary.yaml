    extraction:
      - "vein: глубокий сегмент (ОБВ, БВ, ГБВ, ПкВ, ЗББВ, ПББВ, МБВ, суральные). Тромбоз БПВ / МПВ / притоков -> SUPERFICIAL_THROMBOPHLEBITIS."
      - "floating=true: флотирующий тромб / верхушка."
      - "Термо- / клей-индуцированный тромбоз после операции — тоже эта находка."
    notThis:
      - "«Признаков тромбоза не выявлено», «данных за тромбоз не получено», «без признаков тромбоза», «сжимаема до конца», «просветы свободны от дополнительных эхоструктур» -> NEGATION."
      - "Посттромботические изменения без свежего тромба -> POST_THROMBOTIC_CHANGES."
      - "Тромбофлебит поверхностных вен -> SUPERFICIAL_THROMBOPHLEBITIS."
    targetSpecialty: Дежурный хирург / сосудистый хирург
    routeTemplateCode: URGENT_ESCALATION
    targetDays: 0
    rules: [ { all: [] } ]
    ifMissing: TRIGGER
    examples: ["синт_01", "синт_24 — отрицание", "нижние конечности (5), (7), (8) — отрицание тромбоза, NEGATION"]

  - code: SUPERFICIAL_THROMBOPHLEBITIS
    name: Тромбоз поверхностных вен / тромбофлебит
    active: true
    approved: true
    level: EMERGENCY
    studyTypes: [LOWER_LIMB_VESSELS]
    clinicalNote: Срочность зависит от близости проксимальной границы тромба к соустью (КР ID 668, 2024).
    synonyms:
      - тромбофлебит
      - варикотромбофлебит
      - тромбоз поверхностных вен
      - тромбоз БПВ
      - тромбоз МПВ
      - тромбоз притоков
    attributes: [side, vein, location, distanceToJunctionMm, floating, uncertain]
    extraction:
      - "location: trunk (ствол БПВ / МПВ) | tributaryNearJunction (приустьевые притоки) | tributaryDistal (притоки вдали от ствола) | perforatorSubfascial (подфасциальный сегмент перфоранта)."
      - "distanceToJunctionMm: расстояние от проксимальной границы тромба до СФС / СПС, в мм («в 2 см от СФС» -> 20)."
      - "Ствол без указания расстояния -> distanceToJunctionMm не заполнять, флаг INCOMPLETE."
    notThis:
      - "«Данных за тромбофлебит не получено», «поверхностные вены проходимы» -> NEGATION."
      - "Тромбоз глубоких вен -> DEEP_VEIN_THROMBOSIS (если есть оба — вернуть обе находки)."
    targetSpecialty: Дежурный хирург / флеболог
    routeTemplateCode: URGENT_ESCALATION
    targetDays: 0
    rules:
      - all: [{ attr: location, eq: trunk }, { attr: distanceToJunctionMm, missing: true }]
        level: EMERGENCY        # расстояние не указано — в безопасную сторону
      - all: [{ attr: distanceToJunctionMm, lte: 30 }]
        level: EMERGENCY        # ≤ 3 см от соустья — высокий риск, госпитализация
      - all: [{ attr: location, in: [tributaryNearJunction, perforatorSubfascial] }]
        level: EMERGENCY
      - all: [{ attr: location, eq: trunk }]
        level: URGENT           # > 3 см от соустья
        targetSpecialty: Флеболог / хирург
        routeTemplateCode: CONSULT_OBSERVATION
        targetDays: 1
      - all: []
        level: URGENT           # притоки вдали от ствола
        targetSpecialty: Флеболог / хирург
        routeTemplateCode: CONSULT_OBSERVATION
        targetDays: 3
    ifMissing: TRIGGER
    examples: ["синт_02 — 2 см от СФС", "синт_03 — 18 см от СФС"]

