# Словарь находок — ЧЕРНОВИК на проверку медэксперту
# Один файл читают и ML (что искать и как извлекать), и бэкенд (куда направлять).
#
# Кто что использует:
#   ML      -> code, studyTypes, synonyms, attributes, notThis, + общий блок ml
#   Бэкенд  -> rules, targetSpecialty, targetDays, routeTemplateCode, urgent, ifMissing
#
# Как бэкенд применяет rules: правила проверяются сверху вниз, срабатывает первое,
# у которого выполнены ВСЕ условия (all). Правило может переопределить специалиста,
# срок и срочность. Ни одно не сработало -> находка уходит в notTriggered с
# причиной BELOW_THRESHOLD. Если нужного атрибута нет -> решает ifMissing
# (TRIGGER — запускаем маршрут, врач на подтверждении разберётся; SKIP — не запускаем).
# Правило с result: NO_ROUTE останавливает проверку и маршрут не запускает (BELOW_THRESHOLD).
#
# Пометка VITA: — клиническое решение, которое нужно подтвердить или поправить.
# mlApproved: true — часть для ML (synonyms, attributes, extraction, notThis) утверждена медэкспертом.
# approved: true — утверждена и часть для бэкенда (rules, сроки, специалисты).
# Принцип: ML возвращает факты (в т.ч. функциональные кисты, BI-RADS 1–2), а «маршрут / не маршрут» решает бэкенд по rules.

version: dict-v1-ml

# ----------------------------------------------------------------------------
# Общие правила для ML
# ----------------------------------------------------------------------------
ml:
  urgentPolicy:
    - "Находки с urgent: true (и правила с urgent) — приоритет полноты: при сомнении возвращать находку с uncertain=true, а не пропускать."
    - "Отрицание («тромбоза не выявлено», «кровоток сохранён») проверять строго по той же фразе, к которой относится находка."
  whereToLook:
    - Сначала раздел «Заключение» — по нему решается, есть ли находка.
    - Атрибуты (размер, FIGO, категория) — из описательной части, если в заключении их нет.
    - Нет заключения -> искать по описанию и ставить conclusionFound=false.

  # Находка рядом с этими словами -> notTriggered, reason=NEGATION
  negationCues:
    - не выявлен
    - не выявлено
    - не определяется
    - не определяются
    - не визуализируется
    - не лоцируется
    - не обнаружен
    - отсутствует
    - отсутствуют
    - без признаков
    - данных за .* не получено
    - признаков .* не выявлено
    - достоверно .* не определяется

  # Атрибут uncertain=true (находку всё равно возвращать)
  uncertaintyCues:
    - "?"
    - нельзя исключить
    - не исключается
    - вероятно
    - более вероятно
    - возможно
    - под вопросом
    - подозрение на

  # Орган удалён или находка уже прооперирована -> notTriggered, reason=POST_SURGERY
  postSurgeryCues:
    - состояние после
    - после холецистэктомии
    - удалён
    - удалена
    - резекция

  # Атрибут growth
  growthCues: [с динамикой роста, увеличение размеров, в динамике увеличение, рост]
  stableCues: [без динамики, без отрицательной динамики, стабильн]   # growth=false

  sizeParsing:
    - "Размеры вида 12х11 мм, 1.4*1.1*1.5 см, 3,6*3,5 мм -> sizeMm = наибольший размер в мм."
    - "Сантиметры переводить в мм (0,8 см -> 8)."
    - "Диапазон «до 6-8 мм» -> верхняя граница (8)."
    - "Несколько образований -> sizeMm наибольшего, count = количество."

  sideCues:
    left: [слева, левой, левого, левая, s]
    right: [справа, правой, правого, правая, d]
    both: [с обеих сторон, обеих, билатерально]

  categoryParsing:
    - "BI-RADS / Birads / Br -> birads (число 0–6), подкатегория 4a/4b/4c -> biradsSub."
    - "O-RADS / ORADS, римские цифры (O-RADS I) -> orads (число)."
    - "EU-TIRADS -> tirads + tiradsSystem=EU; TI-RADS без уточнения -> tiradsSystem=UNKNOWN."
    - "Категория указана по сторонам -> отдельная находка на каждую сторону с side."

# ----------------------------------------------------------------------------
# Шаблоны маршрутов (ссылка из routeTemplateCode)
# ----------------------------------------------------------------------------
routeTemplates:
  SURGICAL_STANDARD: консультация -> решение врача -> направление -> госпитализация -> операция -> контроль через 7±2 дня
  DIAGNOSTIC_FIRST: консультация -> диагностическая процедура (гистероскопия с раздельным диагностическим выскабливанием) -> гистология -> решение врача о тактике по результату -> контроль
  OBSERVATION_FOLLOWUP: плановый контроль у профильного врача через targetDays -> напоминание пациенту заранее -> визит состоялся
  CONSULT_OBSERVATION: консультация -> решение врача (наблюдение / обследование) -> контрольный визит
  URGENT_ESCALATION: задача дежурному персоналу немедленно, без сообщения пациенту от системы

# ----------------------------------------------------------------------------
# Находки
# ----------------------------------------------------------------------------
findings:

  # ================= ГИНЕКОЛОГИЯ (ОМТ) =================

  - code: ENDOMETRIAL_POLYP
    name: Полип эндометрия
    active: true
    approved: true
    mlApproved: true
    studyTypes: [PELVIS_FEMALE]
    clinicalNote: Ненаблюдаемая патология — при выявлении всегда показано удаление оперирующим гинекологом.
    synonyms:
      certain:              # uncertain=false
        - полип эндометрия
        - полипы эндометрия
        - множественные полипы эндометрия
        - полипоз эндометрия
        - патология эндометрия, соответствует полипу
        - "патология эндометрия (полип)"
      suspected:            # uncertain=true
        - изменения эндометрия по типу полипа
        - эндометриальное образование, подозрительное на полип
        - очаговое образование эндометрия
        - диффузные / множественные очаговые образования эндометрия
        - локальное утолщение эндометрия
        - фокальное разрастание эндометрия
    attributes: [sizeMm, count, recurrent, menopause, uncertain]
    extraction:
      - "menopause=true: «менопауза», «постменопауза», «постменопаузальный период», «менопауза N лет»."
    notThis:
      - "Полип шейки матки / цервикального канала -> CERVICAL_POLYP (отдельная находка)."
      - "Гистологическое заключение («железисто-фиброзный полип», морфология) — не протокол УЗИ, тип документа не тот."
    targetSpecialty: Оперирующий гинеколог
    routeTemplateCode: SURGICAL_STANDARD
    procedures:
      main: Раздельное диагностическое выскабливание под контролем гистероскопии (отдельно полость матки и цервикальный канал)
      additional:
        name: Гистерорезектоскопия
        indications: [рецидивирующие полипы, образования больших размеров, нестандартное расположение]
    targetDays: 7
    rules:
      - all: [{ attr: uncertain, eq: false }]
        targetDays: 7       # полип описан точно — срочно
      - all: [{ attr: menopause, eq: true }]
        targetDays: 7       # постменопауза — срочно даже при подозрении (выше онкориск)
      - all: [{ attr: patient.age, gte: 50 }]
        targetDays: 7       # менопауза не указана, но возраст 50+
      - all: [{ attr: uncertain, eq: true }]
        targetDays: 14      # подозрение — уточнение, возможно повторное УЗИ на 5–7 день цикла
    ifMissing: TRIGGER
    examples: ["Ж ОМТ (17)", "Ж ОМТ (23)", "Ж ОМТ (8)"]

  - code: ENDOMETRIAL_HYPERPLASIA
    name: Гиперплазия эндометрия
    active: true
    approved: true
    mlApproved: true
    studyTypes: [PELVIS_FEMALE]
    clinicalNote: Тактика определяется только после гистологии; система направляет на консультацию, не на операцию.
    synonyms:
      certain:
        - гиперплазия эндометрия
        - гиперпластический процесс эндометрия
      suspected:
        - диффузное утолщение эндометрия
        - утолщённый эндометрий
        - увеличение М-эхо
        - неоднородная структура эндометрия
        - неоднородный эндометрий
        - толщина эндометрия не соответствует дню цикла
        - несоответствие толщины эндометрия дню цикла
    attributes: [thicknessMm, menopause, fromMeasurement, uncertain]
    extraction:
      - "menopause=true: «менопауза», «постменопауза», «постменопаузальный период»."
      - "thicknessMm: толщина М-эхо / эндометрия в мм."
      - "Если в тексте есть менопауза и указана толщина эндометрия, а слов из synonyms нет — всё равно вернуть эту находку с fromMeasurement=true, uncertain=true и thicknessMm. Решение по порогу принимает бэкенд."
    notThis:
      - "«Локальное утолщение», «фокальное разрастание», «очаговое образование» эндометрия -> ENDOMETRIAL_POLYP (подозрение)."
    targetSpecialty: Оперирующий гинеколог
    routeTemplateCode: DIAGNOSTIC_FIRST
    procedures:
      diagnostic: Гистероскопия с раздельным диагностическим выскабливанием, гистологическое исследование
      afterHistology: Тактику (наблюдение, терапия, хирургическое лечение) определяет врач по результату гистологии
    targetDays: 7
    rules:
      - all: [{ attr: uncertain, eq: false }]
        targetDays: 7       # гиперплазия описана прямо
      - all: [{ attr: fromMeasurement, eq: true }, { attr: thicknessMm, gt: 4 }]
        targetDays: 7       # постменопауза, М-эхо > 4 мм
      - all: [{ attr: fromMeasurement, eq: true }]
        result: NO_ROUTE    # постменопауза, М-эхо <= 4 мм — норма
      - all: [{ attr: menopause, eq: true }]
        targetDays: 7
      - all: [{ attr: patient.age, gte: 50 }]
        targetDays: 7
      - all: [{ attr: uncertain, eq: true }]
        targetDays: 14      # подозрение у женщин репродуктивного возраста
    ifMissing: TRIGGER
    examples: ["Ж ОМТ (17) — гиперплазия прямо", "Ж ОМТ (25) — несоответствие дню цикла, неоднородный", "Ж ОМТ (14) — менопауза, проверить М-эхо"]

  - code: UTERINE_FIBROID
    name: Миома матки (триггер — субмукозный узел)
    active: true
    approved: true
    mlApproved: true
    studyTypes: [PELVIS_FEMALE]
    clinicalNote: Субмукозные узлы (FIGO 0–3) и деформация полости — к оперирующему гинекологу; остальные миомы — плановый контроль у гинеколога через 6 месяцев.
    synonyms:
      - миома матки
      - миоматозный узел
      - лейомиома
      - фибромиома
      - многоузловая миома
      - субмукозная миома
      - подслизистая миома
      - субмукозный узел
      - подслизистый узел
      - субмукозный узел на ножке
      - интрамурально-субмукозный узел
      - миома с центрипетальным ростом
      - узел деформирует полость матки
      - рождающийся миоматозный узел
    attributes: [figo, deformsCavity, prolapsing, sizeMm, count, growth, menopause, uncertain]
    extraction:
      - "figo: «тип N по FIGO», «FIGO N» -> число."
      - "Без типа: «субмукозный узел на ножке» -> 0; «интрамурально-субмукозный» -> 2; «субмукозный / подслизистый» -> 1; «интрамуральный» -> 4; «субсерозный» -> 6."
      - "deformsCavity=true: «деформирует полость матки», «деформация полости матки»."
      - "prolapsing=true: «рождающийся узел», «рождающаяся миома», «узел в цервикальном канале»."
      - "menopause=true: «менопауза», «постменопауза»."
    notThis:
      - "Аденомиоз, диффузные изменения миометрия — не миома."
      - "Миома в стадии кальциноза — возвращать как миому, figo по описанию."
    targetSpecialty: Оперирующий гинеколог
    routeTemplateCode: SURGICAL_STANDARD
    procedures:
      main: Гистерорезектоскопия
    targetDays: 7
    rules:
      - all: [{ attr: prolapsing, eq: true }]
        urgent: true
        targetSpecialty: Дежурный гинеколог
        routeTemplateCode: URGENT_ESCALATION
        targetDays: 0           # рождающийся узел — риск кровотечения
      - all: [{ attr: menopause, eq: true }, { attr: growth, eq: true }]
        targetDays: 7           # рост миомы в постменопаузе — любой тип узла
      - all: [{ attr: figo, lte: 3 }, { attr: uncertain, eq: false }]
        targetDays: 7
      - all: [{ attr: deformsCavity, eq: true }, { attr: uncertain, eq: false }]
        targetDays: 7
      - all: [{ attr: figo, lte: 3 }]
        targetDays: 14          # подозрение
      - all: [{ attr: deformsCavity, eq: true }]
        targetDays: 14
      - all: []                 # все остальные миомы (FIGO 4–8 или тип не указан)
        targetSpecialty: Гинеколог
        routeTemplateCode: OBSERVATION_FOLLOWUP
        targetDays: 180         # контроль через 6 месяцев
    ifMissing: TRIGGER
    examples: ["Ж ОМТ (11) — деформация полости", "Ж ОМТ (22) — FIGO 4, контроль 6 мес", "Ж ОМТ (21) — FIGO 5/6, контроль 6 мес", "Ж ОМТ (2), (10), (13), (16), (19), (20) — тип не указан, контроль 6 мес"]

  - code: OVARIAN_LESION
    name: Образование яичника
    active: true
    mlApproved: true
    studyTypes: [PELVIS_FEMALE]
    synonyms:
      - киста яичника
      - образование яичника
      - объёмное образование яичника
      - эндометриоидная киста
      - эндометриома
      - дермоидная киста
      - тератома
      - кистома
      - цистаденома
      - параовариальная киста
      - жидкостное образование яичника
      - солидное образование яичника
      - кистозно-солидное образование
      - многокамерное образование яичника
      - фолликулярная киста        # функциональная -> functional=true
      - киста жёлтого тела         # функциональная -> functional=true
      - геморрагическая киста      # функциональная -> functional=true
    attributes: [orads, sizeMm, volumeMl, side, growth, solid, papillary, vascularized, septated, functional, menopause, uncertain]
    extraction:
      - "orads: «O-RADS 2», «ORADS 2», «O-RADS II» -> число; по сторонам — отдельная находка на каждую сторону."
      - "solid=true: солидный / кистозно-солидный компонент; papillary=true: папиллярные разрастания, пристеночные включения; vascularized=true: кровоток в образовании при ЦДК."
      - "septated=true: перегородки, многокамерное."
      - "functional=true: фолликулярная киста, киста жёлтого тела, геморрагическая киста."
      - "growth=true: «с динамикой роста», «увеличение по сравнению с»."
    notThis:
      - "Жёлтое тело и доминантный фолликул без слова киста — норма, не находка."
      - "Мультифолликулярные / афолликулярные яичники, снижение овариального резерва — не образование."
      - "Гидросальпингс — маточная труба, не яичник."
      - "Свободная жидкость в малом тазу — не образование яичника."
    targetSpecialty: Оперирующий гинеколог
    routeTemplateCode: SURGICAL_STANDARD
    targetDays: 14
    rules:       # ЧЕРНОВИК для бэкенда, утвердить позже
      - all: [{ attr: functional, eq: true }]
        result: NO_ROUTE
      - all: [{ attr: orads, gte: 4 }]
        targetSpecialty: Онкогинеколог
        targetDays: 7
      - all: [{ attr: menopause, eq: true }]
        targetDays: 7
      - all: [{ attr: orads, eq: 3 }]
      - all: [{ attr: growth, eq: true }]
      - all: [{ attr: solid, eq: true }]
      - all: [{ attr: papillary, eq: true }]
      - all: []
        targetSpecialty: Гинеколог
        routeTemplateCode: OBSERVATION_FOLLOWUP
        targetDays: 180
    ifMissing: TRIGGER
    examples: ["Ж ОМТ (7) — O-RADS 2 с ростом", "Ж ОМТ (1) — параовариальная O-RADS 2", "Ж ОМТ (15) — O-RADS 2 с перегородкой", "Ж ОМТ (9) — киста без категории", "Ж ОМТ (6) — фолликулярная, functional"]

  - code: ECTOPIC_PREGNANCY
    name: Внематочная беременность (экстренно)
    active: true
    urgent: true
    mlApproved: true
    studyTypes: [PELVIS_FEMALE]
    synonyms:
      - внематочная беременность
      - эктопическая беременность
      - трубная беременность
      - шеечная беременность
      - беременность в рубце
