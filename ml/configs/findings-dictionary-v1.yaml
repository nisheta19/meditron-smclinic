      - "«Плодное яйцо в полости матки не визуализируется» -> находка только при hcgPositive=true, с uncertain=true."
    notThis:
      - "Маточная беременность, плодное яйцо в полости матки — не находка."
    targetSpecialty: Дежурный гинеколог
    routeTemplateCode: URGENT_ESCALATION
