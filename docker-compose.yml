services:
  postgres:
    image: postgres:16-alpine
    container_name: meditron-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meditron}
      POSTGRES_USER: ${POSTGRES_USER:-meditron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meditron}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meditron} -d ${POSTGRES_DB:-meditron}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: meditron-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meditron}
      DB_USER: ${POSTGRES_USER:-meditron}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-meditron}
      ML_SERVICE_URL: http://ml:8000
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  # Раскомментировать, когда появится ml/Dockerfile
  # ml:
  #   build: ./ml
  #   container_name: meditron-ml
  #   environment:
  #     BACKEND_URL: http://backend:8080   # ML отправляет результаты в бэкенд
  #   ports:
  #     - "8000:8000"

  # Раскомментировать, когда появится frontend/Dockerfile
  # frontend:
  #   build: ./frontend
  #   container_name: meditron-frontend
  #   depends_on: [backend]
  #   ports:
  #     - "3000:80"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: ${FRONTEND_USE_MOCK:-false}   # true — демо на заглушках, без backend
        VITE_API_URL: /                              # тот же origin: nginx проксирует /api в backend
        BACKEND_PORT: ${BACKEND_PORT:-8080}
    environment:
      API_PROXY: http://backend:8080
    container_name: meditron-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
